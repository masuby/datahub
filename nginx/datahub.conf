# DataHub — Nginx reverse proxy (example)
# Place on your server (e.g. /etc/nginx/sites-available/datahub.conf) and symlink
# into sites-enabled. Obtain TLS certs with certbot:
#   sudo certbot --nginx -d datahub.co.tz -d www.datahub.co.tz

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name datahub.co.tz www.datahub.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datahub.co.tz www.datahub.co.tz;

    # --- TLS (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/datahub.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datahub.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Hardening ---
    server_tokens off;
    client_max_body_size 256k;            # contact form payloads are tiny
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Basic anti-abuse: limit request rate to the API.
    # (Defined in http{} block — see note in README.)
    location /api/ {
        limit_req zone=datahub_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Add this inside your http { } block (e.g. /etc/nginx/nginx.conf):
#   limit_req_zone $binary_remote_addr zone=datahub_api:10m rate=10r/m;
