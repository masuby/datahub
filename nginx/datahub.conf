# DataHub — Nginx reverse proxy
# Canonical host: www.datahub.co.tz  (apex datahub.co.tz redirects to it)
# Proxies to the web container published on 127.0.0.1:3000.
#
# Install: copy to /etc/nginx/sites-available/datahub.conf, then
#   sudo ln -s /etc/nginx/sites-available/datahub.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certs (obtain BEFORE enabling the 443 blocks):
#   sudo certbot certonly --nginx -d datahub.co.tz -d www.datahub.co.tz
#
# Rate-limit zone — add this line INSIDE the http { } block of
# /etc/nginx/nginx.conf (it cannot live in a server block):
#   limit_req_zone $binary_remote_addr zone=datahub_api:10m rate=30r/m;

# ── HTTP → HTTPS (both names) ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name datahub.co.tz www.datahub.co.tz;

    # Let ACME http-01 challenges through if you renew via webroot.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://www.datahub.co.tz$request_uri; }
}

# ── Apex HTTPS → canonical www ───────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name datahub.co.tz;

    ssl_certificate     /etc/letsencrypt/live/datahub.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datahub.co.tz/privkey.pem;

    return 301 https://www.datahub.co.tz$request_uri;
}

# ── Canonical site ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.datahub.co.tz;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/datahub.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datahub.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Hardening ---
    server_tokens off;
    client_max_body_size 256k;            # contact form payloads are tiny

    # Anti-abuse: cap the request rate to the API (zone defined in http{}).
    location /api/ {
        limit_req zone=datahub_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
