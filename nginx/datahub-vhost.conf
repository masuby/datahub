# DataHub virtual host — to be pasted INSIDE the http { } block of the PCL
# Nginx config: /home/pcltz_admin/pcl_analysis/nginx/nginx.conf
#
# Context: PCL Nginx runs as the `pcl-nginx` container and owns ports 80/443 as
# the default_server (server_name _). These name-based blocks match datahub.co.tz
# / www.datahub.co.tz by SNI, so PCL is unaffected. Proxies to the datahub-web-1
# container — `pcl-nginx` must be connected to the `datahub_default` network:
#   docker network connect datahub_default pcl-nginx
#
# Add the HTTP block FIRST, reload, obtain the cert via certbot --webroot, THEN
# add the two HTTPS blocks (they reference the cert files) and reload again.

# ── HTTP: serve ACME challenge, redirect the rest to canonical HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name datahub.co.tz www.datahub.co.tz;

    # certbot --webroot writes challenge files into the mounted dist dir
    # (host: /home/pcltz_admin/pcl_analysis/dist  ->  container: /var/www/html)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.datahub.co.tz$request_uri;
    }
}

# ── HTTPS apex -> canonical www ──  (add AFTER the cert exists)
server {
    listen 443 ssl;
    server_name datahub.co.tz;

    ssl_certificate     /etc/nginx/ssl/datahub-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/datahub-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.datahub.co.tz$request_uri;
}

# ── HTTPS canonical site ──  (add AFTER the cert exists)
server {
    listen 443 ssl;
    server_name www.datahub.co.tz;

    ssl_certificate     /etc/nginx/ssl/datahub-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/datahub-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 256k;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://datahub-web-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
