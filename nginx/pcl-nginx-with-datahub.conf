events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Max upload size (matches API MAX_FILE_SIZE=50MB)
    client_max_body_size 55m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Upstream for API
    upstream api_backend {
        server api:8080;
        keepalive 32;
    }

    # HTTP — redirect everything to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        root /var/www/html;
        index index.html;

        # Map uppercase /Assets/ to lowercase /assets/ (Linux is case-sensitive)
        location /Assets/ {
            alias /var/www/html/assets/;
        }

        # Serve bundled frontend assets without SPA fallback.
        # This prevents returning index.html as a "JS file" when an old cached hash is requested.
        location /assets/ {
            alias /var/www/html/assets/;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Login rate limiting
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File downloads
        location /files/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # Health check endpoint (exact match)
        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files (React app)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }
    }

    # ===================================================================
    # DataHub landing site  (added — PCL above remains the default_server)
    # Name-based vhosts matched by SNI/Host. Proxies to the datahub-web-1
    # container; pcl-nginx must be joined to the datahub network first:
    #   docker network connect datahub_default pcl-nginx
    # ===================================================================

    # HTTP: serve ACME renewals, redirect everything else to canonical HTTPS
    server {
        listen 80;
        server_name datahub.co.tz www.datahub.co.tz;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://www.datahub.co.tz$request_uri;
        }
    }

    # HTTPS apex -> canonical www
    server {
        listen 443 ssl;
        server_name datahub.co.tz;

        ssl_certificate     /etc/nginx/ssl/datahub-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/datahub-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://www.datahub.co.tz$request_uri;
    }

    # HTTPS canonical DataHub site
    server {
        listen 443 ssl;
        server_name www.datahub.co.tz;

        ssl_certificate     /etc/nginx/ssl/datahub-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/datahub-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        server_tokens off;
        client_max_body_size 256k;

        # Security headers (the app also sets its own CSP via proxy)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://datahub-web-1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
